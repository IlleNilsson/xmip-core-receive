# Its own workspace root, so this repository builds on its own.
[workspace]

[package]
name = "xmip-core-receive"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/IlleNilsson/xmip-core-receive"
description = "Xmip Receive Ports and Receive Locations, and what arrives at them."

[dependencies]
xmip-core = { git = "https://github.com/IlleNilsson/xmip-core", branch = "main" }
xmip-stream = { package = "xmip-core-stream", git = "https://github.com/IlleNilsson/xmip-core-stream", branch = "main" }
xmip-party = { package = "xmip-core-party", git = "https://github.com/IlleNilsson/xmip-core-party", branch = "main" }
xmip-context = { package = "xmip-core-context", git = "https://github.com/IlleNilsson/xmip-core-context", branch = "main" }
xmip-authenticate = { package = "xmip-core-authenticate", git = "https://github.com/IlleNilsson/xmip-core-authenticate", branch = "main" }
